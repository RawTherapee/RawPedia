{{ define "main" }}

<div class='row justify-content-center'>
  <div class='col-lg-8'>

  <h1 class = 'mt-4'>{{ .Title }}</h1>
  {{ .Content }}
  </div>
</div>

<div class='row justify-content-center'>
  <div class='col-lg-8'>

  <ul>
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <div>{{ .Summary }}</div>
      </li>
    {{ end }}
  </ul>

  </div>
</div>


{{ end }}
